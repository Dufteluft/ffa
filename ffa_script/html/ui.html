<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming UI Overlay</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="overlay-container">
        <!-- Left Panel: FFA System -->
        <div class="ffa-panel">
            <div class="ffa-header">
                <h1>FFA SYSTEM</h1>
                <p class="subtitle">Here you can kill your neighbour or entity or damage, whatever</p>
                <div class="stats-container">
                    <div class="stat-card">
                        <i class="fas fa-crosshairs icon-kills"></i>
                        <div>
                            <p>KILLS</p>
                            <strong>24/6</strong>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-skull icon-deaths"></i>
                        <div>
                            <p>DEATHS</p>
                            <strong>24/6</strong>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-chart-line icon-kd"></i>
                        <div>
                            <p>KD RATING</p>
                            <strong>24/6</strong>
                        </div>
                    </div>
                </div>
            </div>
            <div class="session-grid">
                <!-- Session cards will be injected here by JS -->
            </div>
        </div>

        <!-- Right Panel: Top of Players -->
        <div class="leaderboard-panel">
            <div class="leaderboard-header">
                <h1>TOP OF PLAYERS</h1>
                <p class="subtitle">Here you can kill your neighbour or entity or damage, whatever</p>
            </div>
            <div class="player-list">
                <!-- Player entries will be injected here by JS -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
